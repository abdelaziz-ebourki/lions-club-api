spring:
  jpa:
    show-sql: false

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/lions_club}
    username: ${DB_USERNAME:lions_club}
    password: ${DB_PASSWORD:lions_club_dev}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.lionsclub: WARN
    org.springframework.security: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
    secure: true
